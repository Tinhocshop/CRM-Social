<!doctype html>

    <script>
      (function() {
        // 1. Bulletproof JSON.stringify against circular structures
        var origStringify = JSON.stringify;
        JSON.stringify = function(val, replacer, space) {
          var seen = new WeakSet();
          return origStringify(val, function(k, v) {
            if (typeof v === 'object' && v !== null) {
              if (seen.has(v)) return '[Circular]';
              seen.add(v);
            }
            if (typeof replacer === 'function') return replacer(k, v);
            return v;
          }, space);
        };

        // 2. Intercept console.error: sanitize Vue component instances
        var origError = console.error;
        console.error = function() {
          var args = [];
          for (var i = 0; i < arguments.length; i++) {
            var item = arguments[i];
            if (item && typeof item === 'object') {
              if (item.$ || item._ || item.effect || item.subTree || item._vnode) {
                args.push('[VueComponentInstance]');
                continue;
              }
              if (item instanceof Error) {
                args.push(item.stack || item.message);
                continue;
              }
            }
            args.push(item);
          }
          try {
            origError.apply(console, args);
          } catch(e) {
            origError.call(console, String(arguments[0]));
          }
        };
      })();
    </script>
